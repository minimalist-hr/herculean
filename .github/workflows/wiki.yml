name: Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]

permissions: {}

# One copy at a time, in the order the changes reached main.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    name: wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy docs/wiki to the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync --archive --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git add --all
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "Sync from ${GITHUB_SHA::7}"
          git push
