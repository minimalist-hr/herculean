workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - analyze
  - deploy

# SonarQube needs coverage from both the API and the app, so all three jobs run together.
.code-changes:
  rules:
    - changes: [api/**/*, app/**/*, .gitlab-ci.yml]

.nuget-cache:
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  cache:
    key:
      files: [api/Directory.Packages.props]
    paths: [.nuget/]

api:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  extends: [.code-changes, .nuget-cache]
  script:
    - cd api
    - dotnet restore
    - dotnet format --verify-no-changes --no-restore
    - dotnet build --no-restore
    - dotnet test --no-build --coverage --coverage-output-format xml --results-directory TestResults
  artifacts:
    paths: [api/TestResults/]
    expire_in: 1 day

app:
  stage: test
  image: node:24
  extends: .code-changes
  cache:
    key:
      files: [app/package-lock.json]
    paths: [.npm/]
  script:
    - cd app
    - npm ci --ignore-scripts --cache ../.npm --prefer-offline
    - npm run lint
    - npm run format
    - npm run typecheck
    - npm test -- --coverage
  artifacts:
    paths: [app/coverage/lcov.info]
    expire_in: 1 day

sonar:
  stage: analyze
  image: mcr.microsoft.com/dotnet/sdk:10.0
  extends: [.code-changes, .nuget-cache]
  needs: [api, app]
  variables:
    GIT_DEPTH: "0"
    SONAR_USER_HOME: $CI_PROJECT_DIR/.sonar
  script:
    - cd api
    - dotnet tool restore
    - >
      dotnet sonarscanner begin
      /o:minimalist-sds
      /k:minimalist-sds_herculean
      /d:sonar.host.url=https://sonarcloud.io
      /d:sonar.token="$SONAR_TOKEN"
      /d:sonar.projectBaseDir="$CI_PROJECT_DIR"
      /d:sonar.qualitygate.wait=true
      /d:sonar.exclusions="docs/**"
      /d:sonar.test.inclusions="app/**/*.test.ts,app/**/*.test.tsx"
      /d:sonar.coverage.exclusions="app/src/app/**"
      /d:sonar.cs.vscoveragexml.reportsPaths="$CI_PROJECT_DIR/api/TestResults/*.xml"
      /d:sonar.javascript.lcov.reportPaths="$CI_PROJECT_DIR/app/coverage/lcov.info"
    - dotnet build --no-incremental
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

mr-checks:
  stage: test
  image: alpine:3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      title="${CI_MERGE_REQUEST_TITLE#Draft: }"
      if ! echo "$title" | grep -Eq '^(feat|fix|docs|test|refactor|chore): \S'; then
        echo "MR title must look like 'feat: add exercise groups'."
        exit 1
      fi
    - |
      if ! echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -Eq '^(feat|fix|docs|test|refactor|chore)/[a-z0-9]+(-[a-z0-9]+)*$'; then
        echo "Branch name must look like 'feat/exercise-groups'."
        exit 1
      fi

wiki:
  stage: deploy
  image: alpine:3
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [docs/wiki/**/*]
  script:
    - apk add --no-cache git rsync
    - git clone "https://oauth2:${WIKI_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" wiki
    - rsync --archive --delete --exclude .git docs/wiki/ wiki/
    - cd wiki
    - git add --all
    - git diff --cached --quiet && exit 0
    - git -c user.name="$GITLAB_USER_NAME" -c user.email="$GITLAB_USER_EMAIL" commit --message "Sync from $CI_COMMIT_SHORT_SHA"
    - git push
