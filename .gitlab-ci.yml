workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - analyze
  - deploy

# SonarQube needs coverage from both the API and the app, so all three jobs run together.
.code-changes:
  rules:
    - changes: &code-paths [api/**/*, app/**/*, .gitlab-ci.yml]

# Installed once per lockfile, then reused by app (to test) and sonarqube (for TypeScript analysis).
# GitLab adds a cache's position in the list to its key, so keep this cache first in every job that uses it.
.node-modules-cache: &node-modules-cache
  key:
    prefix: node-modules
    files: [app/package-lock.json]
  paths: [app/node_modules/]

app:
  stage: check
  image: node:24
  extends: .code-changes
  cache: *node-modules-cache
  script:
    - cd app
    - if [ ! -d node_modules ]; then npm ci --ignore-scripts; fi
    - npm run lint
    - npm run format
    - npm run typecheck
    - npm run api:generate
    - git diff --exit-code -- src/api/schema.ts || (echo "Run npm run api:generate and commit src/api/schema.ts." && exit 1)
    - npm test -- --coverage
  artifacts:
    paths: [app/coverage/lcov.info]
    expire_in: 1 day

api:
  stage: check
  image: mcr.microsoft.com/dotnet/sdk:11.0
  extends: .code-changes
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  cache:
    - key:
        files: [api/Directory.Packages.props]
      paths: [.nuget/]
  script:
    - cd api
    - dotnet format whitespace --verify-no-changes
    - dotnet build
    - git diff --exit-code -- openapi.json || (echo "Build the API and commit api/openapi.json." && exit 1)
    - dotnet test --no-build --coverage --coverage-output-format xml --results-directory TestResults
  artifacts:
    paths: [api/TestResults/]
    expire_in: 1 day

design:
  stage: check
  image: node:24-alpine
  rules:
    - changes: [docs/design/**/*]
  script:
    - node docs/design/capture/check.mjs

mr:
  stage: check
  image: alpine:3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      title="${CI_MERGE_REQUEST_TITLE#Draft: }"
      if ! echo "$title" | grep -Eq '^(feat|fix|docs|test|refactor|chore): \S'; then
        echo "MR title must look like 'feat: add exercise groups'."
        exit 1
      fi
    - |
      if ! echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -Eq '^(feat|fix|docs|test|refactor|chore)/[a-z0-9]+(-[a-z0-9]+)*$'; then
        echo "Branch name must look like 'feat/exercise-groups'."
        exit 1
      fi
    - |
      if ! echo "$CI_MERGE_REQUEST_DESCRIPTION" | grep -Eiq '(closes|relates to) #[0-9]+'; then
        echo "MR description must name its issue, for example 'Closes #12'."
        exit 1
      fi

# The C# analyzers run inside the build, so the API is built again here. Tests are not rerun: coverage comes from app and api.
# Runs on its own on main and on merge requests that change code.
sonarqube:
  stage: analyze
  image: mcr.microsoft.com/dotnet/sdk:11.0
  rules:
    # On a merge request it runs by itself, and a failed quality gate shows as a warning without blocking the merge.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *code-paths
      allow_failure: true
    - changes: *code-paths
  needs: [app, api]
  variables:
    GIT_DEPTH: "0"
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
    SONAR_USER_HOME: $CI_PROJECT_DIR/.sonar
  cache:
    - <<: *node-modules-cache
      policy: pull
    - key:
        files: [api/Directory.Packages.props]
      paths: [.nuget/]
      policy: pull
    - key: sonar
      paths: [.sonar/cache/]
  script:
    - cd api
    - dotnet tool restore
    - >
      dotnet sonarscanner begin
      /o:minimalist-sds
      /k:minimalist-sds_herculean
      /d:sonar.host.url=https://sonarcloud.io
      /d:sonar.token="$SONAR_TOKEN"
      /d:sonar.projectBaseDir="$CI_PROJECT_DIR"
      /d:sonar.qualitygate.wait=true
      /d:sonar.exclusions="docs/**,.nuget/**,.sonar/**,**/node_modules/**,**/Migrations/**,app/src/api/schema.ts"
      /d:sonar.test.inclusions="app/**/*.test.ts,app/**/*.test.tsx"
      /d:sonar.coverage.exclusions="app/src/app/**,api/src/Herculean.Api/Program.cs,api/src/Herculean.ServiceDefaults/**"
      /d:sonar.cpd.exclusions="api/**/*Endpoint.cs"
      /d:sonar.cs.vscoveragexml.reportsPaths="$CI_PROJECT_DIR/api/TestResults/*.xml"
      /d:sonar.javascript.lcov.reportPaths="$CI_PROJECT_DIR/app/coverage/lcov.info"
    - dotnet build
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

wiki:
  stage: deploy
  image: alpine:3
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [docs/wiki/**/*]
  script:
    - apk add --no-cache git rsync
    - git clone "https://oauth2:${WIKI_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" wiki
    - rsync --archive --delete --exclude .git docs/wiki/ wiki/
    - cd wiki
    - git add --all
    - git diff --cached --quiet && exit 0
    - git -c user.name="$GITLAB_USER_NAME" -c user.email="$GITLAB_USER_EMAIL" commit --message "Sync from $CI_COMMIT_SHORT_SHA"
    - git push
