<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Herculean · Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: '{{font}}', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<div style="position: relative; height: 344px; flex: none; overflow: hidden; background: radial-gradient(ellipse 70% 55% at 50% 50%, {{glow}}, transparent 72%)">
<div style="position: absolute; left: 0; right: 0; top: 184px; display: flex; justify-content: center"><span role="img" aria-label="Herculean" style="font-size: 32px; font-weight: 700; letter-spacing: 0.14em; line-height: 1; white-space: nowrap; color: {{c.text}}"><svg width="25.92" height="29.12" viewBox="-4 0 89 100" aria-hidden="true" style="vertical-align: -3.36px; margin: 0 5.73px 0 0.92px"><polygon points="0,0 19.4,0 23.4,4 23.4,9 19.4,9 19.4,91 23.4,91 23.4,96 19.4,100 0,100 -4,96 -4,91 0,91 0,9 -4,9 -4,4" style="fill: {{c.text}}"></polygon><polygon points="61.6,0 81.0,0 85.0,4 85.0,9 81.0,9 81.0,91 85.0,91 85.0,96 81.0,100 61.6,100 57.6,96 57.6,91 61.6,91 61.6,9 57.6,9 57.6,4" style="fill: {{c.text}}"></polygon><polygon points="19.4,44 61.6,32 61.6,56 19.4,68" style="fill: {{c.primary}}"></polygon></svg>ERCU<span style="color: {{c.primaryText}}">LEAN</span></span></div>
</div>
<main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 4px 16px 16px; min-height: 0">
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">Sign in</h1>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="email" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px 0 12px; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; font-family: inherit; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="password" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Password</label>
<div style="position: relative">
<input id="password" type="password" autocomplete="current-password" placeholder="Your password" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 48px 0 12px; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; font-family: inherit; font-size: 16px">
<button aria-label="Show password" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: none; background: transparent; color: {{c.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
</div>
<a href="A10-Account-Reset-Password.dc.html" style="align-self: flex-start; margin-top: -16px; height: 44px; margin-left: -8px; padding: 0 8px; display: flex; align-items: center; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.primaryText}}">Forgot password?</a>
</main>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid {{c.border}}; background: {{c.card}}">
<a href="H01-Home.dc.html" style="height: 48px; box-sizing: border-box; border-radius: {{r.ctrl}}; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: {{c.primary}}; color: {{c.onPrimary}}">Sign in</a>
<p style="margin: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: {{c.muted}}">New here?<a href="A20-Account-Create.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 8px; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.primaryText}}">Create account</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"palette":{"editor":"enum","options":["Racing blue","Titanium"],"default":"Racing blue","section":"Theme"},"font":{"editor":"enum","options":["Chakra Petch","Oxanium","Exo 2","Saira"],"default":"Chakra Petch","section":"Theme"},"corners":{"editor":"enum","options":["sharp","soft"],"default":"sharp","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const pal = this.props.palette ?? 'Racing blue';
    const font = this.props.font ?? 'Chakra Petch';
    const sharp = (this.props.corners ?? 'sharp') === 'sharp';
    const r = sharp
      ? { card: '6px', ctrl: '4px', pill: '3px', check: '3px', sheet: '10px' }
      : { card: '16px', ctrl: '10px', pill: '999px', check: '8px', sheet: '24px' };
    const tint = (hex, a) => {
      let h = String(hex).replace('#', '');
      if (h.length === 3) h = h.split('').map((x) => x + x).join('');
      const n = parseInt(h, 16);
      return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + a + ')';
    };
    const accents = {
      'Racing blue': { dark: { primary: '#1A55E6', primaryText: '#7EA2FF', onPrimary: '#FFFFFF' }, light: { primary: '#1446C8', primaryText: '#1446C8', onPrimary: '#FFFFFF' } },
      'Titanium': { dark: { primary: '#C9CED6', primaryText: '#DDE1E6', onPrimary: '#050506' }, light: { primary: '#2A2D33', primaryText: '#1446C8', onPrimary: '#FFFFFF' } }
    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Racing blue'])[dark ? 'dark' : 'light']);
    const primary = c.primary;
    c.danger = dark ? '#F87171' : '#DC2626';
    c.onDanger = dark ? '#050506' : '#FFFFFF';
    const st = this.state || {};
    const radio = (items, key, def) => {
      const cur = st[key] || def;
      return items.map((it) => {
        const on = it.id === cur;
        return Object.assign({}, it, {
          on: on,
          hasSub: !!it.sub,
          edge: on ? c.primary : c.border,
          bg: on ? c.raised : 'transparent',
          ring: on ? c.primary : c.muted,
          dot: on ? c.primary : 'transparent',
          pick: () => this.setState({ [key]: it.id })
        });
      });
    };
    c.glow = tint(c.primary, dark ? 0.16 : 0.08);
    return { c, r, font, glow: c.glow };
  }
}
</script>
</body>
</html>
