<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: '{{font}}', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 16px; padding: 48px 16px 16px">
<p style="margin: 0 0 -18px; height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}}">Today</p>
<p style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700">October 2026</p>
<div style="height: 80px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.card}}"></div>
<div style="height: 330px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.card}}"></div>
</div>
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.62)"></div>
<section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 34px; border-radius: {{r.sheet}} {{r.sheet}} 0 0; border-top: 1px solid {{c.border}}; background: {{c.card}}">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: {{c.border}}"></span>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="sheet-title" style="margin: 0; font-size: 22px; font-weight: 700">Back and shoulders 1</h2>
</div>
<a href="W40-Workout-Month.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; margin: -6px -8px 0 0; display: flex; align-items: center; justify-content: center; color: {{c.muted}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.success}}"><span aria-hidden="true" style="width: 8px; height: 8px; flex: none; border-radius: {{r.pill}}; background: {{c.success}}"></span>Completed · Tuesday, 20 October</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.raised}}"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Time</span><span style="font-size: 18px; font-weight: 700">52 min</span></div><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.raised}}"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Sets</span><span style="font-size: 18px; font-weight: 700">14</span></div><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.raised}}"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Volume</span><span style="font-size: 18px; font-weight: 700">7,120 kg</span></div></div>
<div style="display: flex; flex-direction: column"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; border-top: 1px solid {{c.border}}"><span style="font-size: 14px; font-weight: 700">Pull-up</span><span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">3 sets</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; border-top: 1px solid {{c.border}}"><span style="font-size: 14px; font-weight: 700">Smith machine shoulder press</span><span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">3 sets</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; border-top: 1px solid {{c.border}}"><span style="font-size: 14px; font-weight: 700">Machine row</span><span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">2 sets</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; border-top: 1px solid {{c.border}}"><span style="font-size: 14px; font-weight: 700">Seated side lateral raise</span><span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">2 sets</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; border-top: 1px solid {{c.border}}"><span style="font-size: 14px; font-weight: 700">Lat pulldown</span><span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">2 sets</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; border-top: 1px solid {{c.border}}"><span style="font-size: 14px; font-weight: 700">Machine shoulder press</span><span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">2 sets</span></div></div>
<div style="display: flex; flex-direction: column; gap: 8px; margin: 4px -16px 0; padding: 16px 16px 0; border-top: 1px solid {{c.border}}"><a href="W20-Workout-Past-Day.dc.html" style="height: 48px; box-sizing: border-box; border-radius: {{r.ctrl}}; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: {{c.primary}}; color: {{c.onPrimary}}">Open day</a></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"palette":{"editor":"enum","options":["Racing blue","Titanium"],"default":"Racing blue","section":"Theme"},"font":{"editor":"enum","options":["Chakra Petch","Oxanium","Exo 2","Saira"],"default":"Chakra Petch","section":"Theme"},"corners":{"editor":"enum","options":["sharp","soft"],"default":"sharp","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const pal = this.props.palette ?? 'Racing blue';
    const font = this.props.font ?? 'Chakra Petch';
    const sharp = (this.props.corners ?? 'sharp') === 'sharp';
    const r = sharp
      ? { card: '6px', ctrl: '4px', pill: '3px', check: '3px', sheet: '10px' }
      : { card: '16px', ctrl: '10px', pill: '999px', check: '8px', sheet: '24px' };
    const tint = (hex, a) => {
      let h = String(hex).replace('#', '');
      if (h.length === 3) h = h.split('').map((x) => x + x).join('');
      const n = parseInt(h, 16);
      return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + a + ')';
    };
    const accents = {
      'Racing blue': { dark: { primary: '#1A55E6', primaryText: '#7EA2FF', onPrimary: '#FFFFFF' }, light: { primary: '#1446C8', primaryText: '#1446C8', onPrimary: '#FFFFFF' } },
      'Titanium': { dark: { primary: '#C9CED6', primaryText: '#DDE1E6', onPrimary: '#050506' }, light: { primary: '#2A2D33', primaryText: '#1446C8', onPrimary: '#FFFFFF' } }
    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Racing blue'])[dark ? 'dark' : 'light']);
    c.success = dark ? '#4ADE80' : '#166534';
    const primary = c.primary;
    c.danger = dark ? '#F87171' : '#DC2626';
    c.onDanger = dark ? '#050506' : '#FFFFFF';
    const st = this.state || {};
    const radio = (items, key, def) => {
      const cur = st[key] || def;
      return items.map((it) => {
        const on = it.id === cur;
        return Object.assign({}, it, {
          on: on,
          hasSub: !!it.sub,
          edge: on ? c.primary : c.border,
          bg: on ? c.raised : 'transparent',
          ring: on ? c.primary : c.muted,
          dot: on ? c.primary : 'transparent',
          pick: () => this.setState({ [key]: it.id })
        });
      });
    };
    return { c, r, font };
  }
}
</script>
</body>
</html>
