<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Herculean · Setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: '{{font}}', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 48px 16px 16px; min-height: 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Welcome to Herculean</p>
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">Set up</h1>
<p style="margin: 0; font-size: 14px; color: {{c.muted}}">You can change all of this later in Settings.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="name" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Name</label>
<input id="name" type="text" autocomplete="name" placeholder="Your name" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px 0 12px; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; font-family: inherit; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p id="units-label" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Units</p>
<div role="radiogroup" aria-labelledby="units-label" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{units}}" as="o" hint-placeholder-count="2">
<button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 8px; min-height: 60px; padding: 12px; border-radius: {{r.ctrl}}; border: 1px solid {{o.edge}}; background: {{o.bg}}; color: {{c.text}}; text-align: left; cursor: pointer">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{o.title}}</span><span style="font-size: 12px; color: {{c.muted}}">{{o.sub}}</span></span>
<span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 999px; border: 1.5px solid {{o.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{o.dot}}"></span></span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p id="rest-label" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Default rest time</p>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 8px; align-items: center">
<button aria-label="15 seconds less" onClick="{{less}}" style="height: 52px; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<div role="slider" aria-labelledby="rest-label" style="display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; font-size: 32px; font-weight: 700">{{time}}</div>
<button aria-label="15 seconds more" onClick="{{more}}" style="height: 52px; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div role="group" aria-label="Quick picks" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
<button aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="height: 44px; padding: 0; border-radius: {{r.ctrl}}; border: 1px solid {{p.edge}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 14px; font-weight: 700; cursor: pointer">{{p.label}}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; color: {{c.muted}}">Starts after every checked set.</p>
</div>
</div>
</main>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid {{c.border}}; background: {{c.card}}">
<a href="H05-Home-No-Routines.dc.html" style="height: 48px; box-sizing: border-box; border-radius: {{r.ctrl}}; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: {{c.primary}}; color: {{c.onPrimary}}">Finish setup</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"palette":{"editor":"enum","options":["Racing blue","Titanium"],"default":"Racing blue","section":"Theme"},"font":{"editor":"enum","options":["Chakra Petch","Oxanium","Exo 2","Saira"],"default":"Chakra Petch","section":"Theme"},"corners":{"editor":"enum","options":["sharp","soft"],"default":"sharp","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const pal = this.props.palette ?? 'Racing blue';
    const font = this.props.font ?? 'Chakra Petch';
    const sharp = (this.props.corners ?? 'sharp') === 'sharp';
    const r = sharp
      ? { card: '6px', ctrl: '4px', pill: '3px', check: '3px', sheet: '10px' }
      : { card: '16px', ctrl: '10px', pill: '999px', check: '8px', sheet: '24px' };
    const tint = (hex, a) => {
      let h = String(hex).replace('#', '');
      if (h.length === 3) h = h.split('').map((x) => x + x).join('');
      const n = parseInt(h, 16);
      return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + a + ')';
    };
    const accents = {
      'Racing blue': { dark: { primary: '#1A55E6', primaryText: '#7EA2FF', onPrimary: '#FFFFFF' }, light: { primary: '#1446C8', primaryText: '#1446C8', onPrimary: '#FFFFFF' } },
      'Titanium': { dark: { primary: '#C9CED6', primaryText: '#DDE1E6', onPrimary: '#050506' }, light: { primary: '#2A2D33', primaryText: '#1446C8', onPrimary: '#FFFFFF' } }
    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Racing blue'])[dark ? 'dark' : 'light']);
    const primary = c.primary;
    c.danger = dark ? '#F87171' : '#DC2626';
    c.onDanger = dark ? '#050506' : '#FFFFFF';
    const st = this.state || {};
    const radio = (items, key, def) => {
      const cur = st[key] || def;
      return items.map((it) => {
        const on = it.id === cur;
        return Object.assign({}, it, {
          on: on,
          hasSub: !!it.sub,
          edge: on ? c.primary : c.border,
          bg: on ? c.raised : 'transparent',
          ring: on ? c.primary : c.muted,
          dot: on ? c.primary : 'transparent',
          pick: () => this.setState({ [key]: it.id })
        });
      });
    };
    const units = radio([{ id: 'metric', title: 'Metric', sub: 'kg, cm' }, { id: 'imperial', title: 'Imperial', sub: 'lb, in' }], 'units', 'metric');
    const secs = st.secs || 180;
    const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    const presets = [60, 120, 180, 240, 300].map((s) => {
      const on = s === secs;
      return { label: fmt(s), on, edge: on ? c.primary : c.border, bg: on ? c.primary : c.raised, fg: on ? c.onPrimary : c.text, pick: () => this.setState({ secs: s }) };
    });
    const less = () => this.setState({ secs: Math.max(15, secs - 15) });
    const more = () => this.setState({ secs: Math.min(600, secs + 15) });
    const time = fmt(secs);
    return { c, r, font, units, presets, less, more, time };
  }
}
</script>
</body>
</html>
