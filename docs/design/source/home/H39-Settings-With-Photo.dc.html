    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Nitro'])[dark ? 'dark' : 'light']);
    const primary = c.primary;
    c.danger = dark ? '#F87171' : '#DC2626';
    c.dangerFill = '#DC2626';
    c.onDanger = '#FFFFFF';
    c.day = { monday: dark ? '#C58FA6' : '#8E4A68', tuesday: dark ? '#A99BC9' : '#66568F', wednesday: dark ? '#7FB0C2' : '#3B6E82', thursday: dark ? '#7FB59F' : '#3C7560', friday: dark ? '#A9B77E' : '#5C6B32', saturday: dark ? '#C9B57A' : '#75621F', sunday: dark ? '#C99A7A' : '#8A5735' };
    const st = this.state || {};
    const radio = (items, key, def) => {
      const cur = st[key] || def;
      return items.map((it) => {
        const on = it.id === cur;
        return Object.assign({}, it, {
          on: on,
          hasSub: !!it.sub,
          edge: on ? c.primary : c.border,
          bg: on ? c.raised : 'transparent',
          ring: on ? c.primary : c.muted,
          dot: on ? c.primary : 'transparent',
          pick: () => this.setState({ [key]: it.id })
        });
      });
    };
    return { c, r, font };
  }
}
</script>
