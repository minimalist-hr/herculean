<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"palette":{"editor":"enum","options":["Nitro","Chrome"],"default":"Nitro","section":"Theme"},"font":{"editor":"enum","options":["Chakra Petch","Oxanium","Exo 2","Saira"],"default":"Chakra Petch","section":"Theme"},"corners":{"editor":"enum","options":["sharp","soft"],"default":"sharp","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const pal = this.props.palette ?? 'Nitro';
    const font = this.props.font ?? 'Chakra Petch';
    const sharp = (this.props.corners ?? 'sharp') === 'sharp';
    const r = sharp
      ? { card: '6px', ctrl: '4px', pill: '3px', check: '3px', sheet: '10px' }
      : { card: '16px', ctrl: '10px', pill: '999px', check: '8px', sheet: '24px' };
    const tint = (hex, a) => {
      let h = String(hex).replace('#', '');
      if (h.length === 3) h = h.split('').map((x) => x + x).join('');
      const n = parseInt(h, 16);
      return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + a + ')';
    };
    const accents = {
      'Nitro': { dark: { primary: '#1A55E6', primaryText: '#7EA2FF', onPrimary: '#FFFFFF' }, light: { primary: '#1446C8', primaryText: '#1446C8', onPrimary: '#FFFFFF' } },
      'Chrome': { dark: { primary: '#C9CED6', primaryText: '#DDE1E6', onPrimary: '#050506' }, light: { primary: '#2A2D33', primaryText: '#1446C8', onPrimary: '#FFFFFF' } }
    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Nitro'])[dark ? 'dark' : 'light']);
    const primary = c.primary;
    c.danger = dark ? '#F87171' : '#DC2626';
    c.dangerFill = '#DC2626';
    c.onDanger = '#FFFFFF';
    c.day = { monday: dark ? '#C58FA6' : '#8E4A68', tuesday: dark ? '#A99BC9' : '#66568F', wednesday: dark ? '#7FB0C2' : '#3B6E82', thursday: dark ? '#7FB59F' : '#3C7560', friday: dark ? '#A9B77E' : '#5C6B32', saturday: dark ? '#C9B57A' : '#75621F', sunday: dark ? '#C99A7A' : '#8A5735' };
    const st = this.state || {};
    const radio = (items, key, def) => {
      const cur = st[key] || def;
      return items.map((it) => {
        const on = it.id === cur;
        return Object.assign({}, it, {
          on: on,
          hasSub: !!it.sub,
          edge: on ? c.primary : c.border,
          bg: on ? c.raised : 'transparent',
          ring: on ? c.primary : c.muted,
          dot: on ? c.primary : 'transparent',
          pick: () => this.setState({ [key]: it.id })
        });
      });
    };
    return { c, r, font };
  }
}
