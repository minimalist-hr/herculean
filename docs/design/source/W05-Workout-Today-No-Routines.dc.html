<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Herculean · Today, no routines yet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: '{{font}}', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 48px 16px 16px; min-height: 0">
<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Friday, 23 October</p>
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">Today</h1>
</div>
<a href="W40-Workout-Month.dc.html" aria-label="Month view" style="width: 44px; height: 44px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></a>
</header>
<nav aria-label="This week" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<a href="{{d.href}}" aria-label="{{d.aria}}" style="height: 64px; box-sizing: border-box; text-decoration: none; border-radius: {{r.ctrl}}; border: 1px solid {{d.borderColor}}; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{d.labelColor}}">{{d.l}}</span>
<span style="font-size: 18px; font-weight: 700">{{d.n}}</span>
<span aria-hidden="true" style="width: 10px; height: 2px; background: {{d.dot}}"></span>
</a>
</sc-for>
</nav>
<section aria-labelledby="load-title" style="display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 16px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.card}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Get started</p>
<h2 id="load-title" style="margin: 0; font-size: 22px; font-weight: 700">No routines yet</h2>
<p style="margin: 0; font-size: 13px; color: {{c.muted}}">Create a routine, then plan it on the days you train.</p>
</div>
<a href="R30-Routines-New.dc.html" style="height: 48px; box-sizing: border-box; border-radius: {{r.ctrl}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: {{c.primary}}; color: {{c.onPrimary}}">Create routine</a>
</section>
</main>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 28px; border-top: 1px solid {{c.border}}; background: {{c.bg}}">
<a href="H01-Home.dc.html" style="height: 52px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: {{c.muted}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5v10h-5.5v-6h-5v6H4z"></path></svg>
Home
</a>
<a href="W05-Workout-Today-No-Routines.dc.html" aria-current="page" style="height: 52px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: {{c.primaryText}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"></path></svg>
Workout
</a>
<a href="R01-Routines.dc.html" style="height: 52px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: {{c.muted}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>
Routines
</a>
<a href="E01-Exercises.dc.html" style="height: 52px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: {{c.muted}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="0.5"></rect><rect x="13" y="4" width="7" height="7" rx="0.5"></rect><rect x="4" y="13" width="7" height="7" rx="0.5"></rect><rect x="13" y="13" width="7" height="7" rx="0.5"></rect></svg>
Exercises
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"palette":{"editor":"enum","options":["Racing blue","Titanium"],"default":"Racing blue","section":"Theme"},"font":{"editor":"enum","options":["Chakra Petch","Oxanium","Exo 2","Saira"],"default":"Chakra Petch","section":"Theme"},"corners":{"editor":"enum","options":["sharp","soft"],"default":"sharp","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const pal = this.props.palette ?? 'Racing blue';
    const font = this.props.font ?? 'Chakra Petch';
    const sharp = (this.props.corners ?? 'sharp') === 'sharp';
    const r = sharp
      ? { card: '6px', ctrl: '4px', pill: '3px' }
      : { card: '16px', ctrl: '10px', pill: '999px' };
    const accents = {
      'Racing blue': { dark: { primary: '#1A55E6', primaryText: '#7EA2FF', onPrimary: '#FFFFFF' }, light: { primary: '#1446C8', primaryText: '#1446C8', onPrimary: '#FFFFFF' } },
      'Titanium': { dark: { primary: '#C9CED6', primaryText: '#DDE1E6', onPrimary: '#050506' }, light: { primary: '#2A2D33', primaryText: '#1446C8', onPrimary: '#FFFFFF' } }
    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Racing blue'])[dark ? 'dark' : 'light']);
    const primary = c.primary;
    c.success = dark ? '#4ADE80' : '#166534';
    const days = [
      { l: 'Mon', n: '19', s: '', full: 'Monday 19' },
      { l: 'Tue', n: '20', s: '', full: 'Tuesday 20' },
      { l: 'Wed', n: '21', s: '', full: 'Wednesday 21' },
      { l: 'Thu', n: '22', s: '', full: 'Thursday 22' },
      { l: 'Fri', n: '23', s: 'today', full: 'Friday 23, today' },
      { l: 'Sat', n: '24', s: '', full: 'Saturday 24' },
      { l: 'Sun', n: '25', s: '', full: 'Sunday 25' }
    ].map((d) => {
      const today = d.s === 'today';
      return {
        l: d.l,
        n: d.n,
        href: d.href || '#',
        aria: d.full,
        bg: today ? primary : 'transparent',
        fg: today ? c.onPrimary : c.text,
        borderColor: today ? primary : c.border,
        labelColor: today ? c.onPrimary : c.muted,
        dot: d.s === 'done' ? c.success : 'transparent'
      };
    });
    return { c, r, font, days };
  }
}
</script>
</body>
</html>
