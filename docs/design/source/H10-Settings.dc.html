<a href="H13-Settings-Color.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border: none; text-decoration: none; border-top: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; text-align: left">

<span style="font-size: 16px; font-weight: 600">Units</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: {{c.muted}}">Metric<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</a>
<a href="H15-Settings-Rest-Time.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border: none; text-decoration: none; border-top: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; text-align: left">
<span style="font-size: 16px; font-weight: 600">Default rest time</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: {{c.muted}}">1:30<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</a>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border-top: 1px solid {{c.border}}">
<span style="font-size: 16px; font-weight: 600">{{t.label}}</span>
<button role="switch" aria-checked="{{t.on}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="width: 48px; height: 28px; flex: none; position: relative; padding: 0; border: 1px solid {{t.edge}}; border-radius: {{r.ctrl}}; background: {{t.track}}; cursor: pointer">
<span style="position: absolute; top: 2px; left: {{t.knobLeft}}; width: 22px; height: 22px; border-radius: {{r.check}}; background: {{t.knob}}"></span>
</button>
</div>
</sc-for>
</div>
</section>
<section aria-labelledby="s-account" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="s-account" style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Account</h2>

<a href="H16-Settings-Name.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border: none; text-decoration: none; background: transparent; color: {{c.text}}; text-align: left">
<span style="font-size: 16px; font-weight: 600">Name</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: {{c.muted}}">Filip Mučnjak<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</a>
<a href="H17-Settings-Email.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border: none; border-top: 1px solid {{c.border}}; text-decoration: none; background: transparent; color: {{c.text}}; text-align: left">
<span style="font-size: 16px; font-weight: 600">Email</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: {{c.muted}}">you@example.com<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>

<a href="H18-Settings-Password.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border: none; border-top: 1px solid {{c.border}}; text-decoration: none; background: transparent; color: {{c.text}}; text-align: left">
<span style="font-size: 16px; font-weight: 600">Password</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: {{c.muted}}">Change<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</a>

<section aria-labelledby="s-about" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="s-about" style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">About</h2>

</a>
<a href="H21-Settings-Privacy.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border: none; border-top: 1px solid {{c.border}}; text-decoration: none; background: transparent; color: {{c.text}}; text-align: left">
<span style="font-size: 16px; font-weight: 600">Privacy policy</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: {{c.muted}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</a>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border-top: 1px solid {{c.border}}">

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"palette":{"editor":"enum","options":["Racing blue","Titanium"],"default":"Racing blue","section":"Theme"},"font":{"editor":"enum","options":["Chakra Petch","Oxanium","Exo 2","Saira"],"default":"Chakra Petch","section":"Theme"},"corners":{"editor":"enum","options":["sharp","soft"],"default":"sharp","section":"Theme"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const pal = this.props.palette ?? 'Racing blue';
    const font = this.props.font ?? 'Chakra Petch';
    const sharp = (this.props.corners ?? 'sharp') === 'sharp';
    const r = sharp
      ? { card: '6px', ctrl: '4px', pill: '3px', check: '3px', sheet: '10px' }
      : { card: '16px', ctrl: '10px', pill: '999px', check: '8px', sheet: '24px' };
    const accents = {
      'Racing blue': { dark: { primary: '#1A55E6', primaryText: '#7EA2FF', onPrimary: '#FFFFFF' }, light: { primary: '#1446C8', primaryText: '#1446C8', onPrimary: '#FFFFFF' } },
      'Titanium': { dark: { primary: '#C9CED6', primaryText: '#DDE1E6', onPrimary: '#050506' }, light: { primary: '#2A2D33', primaryText: '#1446C8', onPrimary: '#FFFFFF' } }
    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Racing blue'])[dark ? 'dark' : 'light']);
    c.danger = dark ? '#F87171' : '#DC2626';
    const st = this.state || {};
    const on = st.on || [true, true];
    const toggles = ['Sound when rest ends', 'Vibrate when rest ends'].map((label, i) => ({
      label,
      on: !!on[i],
      track: on[i] ? c.primary : c.raised,
      edge: on[i] ? c.primary : c.border,
      knob: on[i] ? c.onPrimary : c.muted,
      knobLeft: on[i] ? '22px' : '2px',
      flip: () => {
        const next = on.slice();
        next[i] = !next[i];
        this.setState({ on: next });
      }
    }));
    return { c, r, font, toggles };
  }
}
</script>
</body>
</html>
