<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Herculean · Finish workout, nothing logged</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: '{{font}}', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 48px 16px 16px; min-height: 0">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Chest and arms 2 · Friday, 23 October</p>
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">Finish workout</h1>
</div>
<div role="note" style="display: flex; gap: 12px; padding: 14px 16px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.raised}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true" style="flex: none; margin-top: 1px; color: {{c.warn}}"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">No sets checked off</span>
<span style="font-size: 13px; color: {{c.muted}}">There’s nothing to save. Go back and check off your sets, or discard the workout.</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.card}}">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Duration</span>
<span style="font-size: 24px; font-weight: 700">0:06:40</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.card}}">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Sets</span>
<span style="font-size: 24px; font-weight: 700">0 / 19</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.card}}">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Volume</span>
<span style="font-size: 24px; font-weight: 700">0 kg</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.card}}">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Records</span>
<span style="font-size: 24px; font-weight: 700">0</span>
</div>
</div>
</main>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid {{c.border}}; background: {{c.card}}">
<a href="L01-Logging.dc.html" style="height: 48px; box-sizing: border-box; border-radius: {{r.ctrl}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: {{c.primary}}; color: {{c.onPrimary}}">Keep logging</a>
<a href="W01-Workout-Today.dc.html" style="height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.danger}}; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Discard workout</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"palette":{"editor":"enum","options":["Racing blue","Titanium"],"default":"Racing blue","section":"Theme"},"font":{"editor":"enum","options":["Chakra Petch","Oxanium","Exo 2","Saira"],"default":"Chakra Petch","section":"Theme"},"corners":{"editor":"enum","options":["sharp","soft"],"default":"sharp","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const pal = this.props.palette ?? 'Racing blue';
    const font = this.props.font ?? 'Chakra Petch';
    const sharp = (this.props.corners ?? 'sharp') === 'sharp';
    const r = sharp
      ? { card: '6px', ctrl: '4px', pill: '3px', check: '3px', sheet: '10px' }
      : { card: '16px', ctrl: '10px', pill: '999px', check: '8px', sheet: '24px' };
    const accents = {
      'Racing blue': { dark: { primary: '#1A55E6', primaryText: '#7EA2FF', onPrimary: '#FFFFFF' }, light: { primary: '#1446C8', primaryText: '#1446C8', onPrimary: '#FFFFFF' } },
      'Titanium': { dark: { primary: '#C9CED6', primaryText: '#DDE1E6', onPrimary: '#050506' }, light: { primary: '#2A2D33', primaryText: '#1446C8', onPrimary: '#FFFFFF' } }
    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Racing blue'])[dark ? 'dark' : 'light']);
    c.danger = dark ? '#F87171' : '#DC2626';
    c.warn = dark ? '#F5B83D' : '#B45309';
    return { c, r, font };
  }
}
</script>
</body>
</html>
