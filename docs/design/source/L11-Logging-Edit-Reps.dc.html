<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Herculean · Edit reps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: '{{font}}', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 48px 16px 16px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">Friday, 23 October · 6:40</p>
<p style="margin: -8px 0 0; font-size: 32px; line-height: 1.05; font-weight: 700">Chest and arms 2</p>
<div style="height: 4px; margin: 8px 0; background: {{c.border}}"></div>
<div style="height: 64px; border-radius: {{r.card}}; border: 1px solid {{c.border}}; background: {{c.card}}"></div>
<div style="height: 560px; border-radius: {{r.card}}; border: 1px solid {{c.primary}}; background: {{c.card}}"></div>
</div>
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.62)"></div>
<section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 34px; border-radius: {{r.sheet}} {{r.sheet}} 0 0; border-top: 1px solid {{c.border}}; background: {{c.card}}">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: {{c.border}}"></span>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="sheet-title" style="margin: 0; font-size: 22px; font-weight: 700">Set 2 · Smith machine incline bench press</h2>
<p style="margin: 0; font-size: 13px; color: {{c.muted}}">Last time 82.5 kg × 10</p>
</div>
<a href="L01-Logging.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; margin: -6px -8px 0 0; display: flex; align-items: center; justify-content: center; color: {{c.muted}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="2">
<button aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; border-radius: {{r.ctrl}}; border: 1.5px solid {{f.edge}}; background: {{f.bg}}; color: {{c.text}}; text-align: left; cursor: pointer">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}}">{{f.label}}</span>
<span style="font-size: 32px; font-weight: 700; line-height: 1.1">{{f.value}}<span style="font-size: 14px; font-weight: 600; color: {{c.muted}}"> {{f.unit}}</span></span>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button onClick="{{down}}" style="height: 44px; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; font-size: 15px; font-weight: 700; cursor: pointer">− {{step}}</button>
<button onClick="{{up}}" style="height: 44px; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; font-size: 15px; font-weight: 700; cursor: pointer">+ {{step}}</button>
</div>
<div role="group" aria-label="Number keypad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button aria-label="{{k.aria}}" onClick="{{k.press}}" style="height: 52px; border-radius: {{r.ctrl}}; border: none; background: {{c.raised}}; color: {{k.color}}; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{ false }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z M12 9l5 6M17 9l-5 6"></path></svg>
</sc-if>
<sc-if value="{{k.isText}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin: 4px -16px 0; padding: 16px 16px 0; border-top: 1px solid {{c.border}}">
<a href="L01-Logging.dc.html" style="height: 48px; border-radius: {{r.ctrl}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: {{c.primary}}; color: {{c.onPrimary}}">Save set</a>
<a href="L01-Logging.dc.html" style="height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Cancel</a>
<a href="L12-Logging-Set-Removed.dc.html" style="height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: {{r.ctrl}}; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.danger}}; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Remove set</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"palette":{"editor":"enum","options":["Racing blue","Titanium"],"default":"Racing blue","section":"Theme"},"font":{"editor":"enum","options":["Chakra Petch","Oxanium","Exo 2","Saira"],"default":"Chakra Petch","section":"Theme"},"corners":{"editor":"enum","options":["sharp","soft"],"default":"sharp","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const pal = this.props.palette ?? 'Racing blue';
    const font = this.props.font ?? 'Chakra Petch';
    const sharp = (this.props.corners ?? 'sharp') === 'sharp';
    const r = sharp
      ? { card: '6px', ctrl: '4px', pill: '3px', check: '3px', sheet: '10px' }
      : { card: '16px', ctrl: '10px', pill: '999px', check: '8px', sheet: '24px' };
    const accents = {
      'Racing blue': { dark: { primary: '#1A55E6', primaryText: '#7EA2FF', onPrimary: '#FFFFFF' }, light: { primary: '#1446C8', primaryText: '#1446C8', onPrimary: '#FFFFFF' } },
      'Titanium': { dark: { primary: '#C9CED6', primaryText: '#DDE1E6', onPrimary: '#050506' }, light: { primary: '#2A2D33', primaryText: '#1446C8', onPrimary: '#FFFFFF' } }
    };
    const neutral = dark
      ? { bg: '#050506', card: '#0F1012', raised: '#17181B', border: '#2C2F34', text: '#F2F3F5', muted: '#A9AEB6' }
      : { bg: '#F4F5F7', card: '#ECEEF1', raised: '#E2E5E9', border: '#D0D4DA', text: '#0A0B0D', muted: '#4F555D' };
    const c = Object.assign({}, neutral, (accents[pal] || accents['Racing blue'])[dark ? 'dark' : 'light']);
    const st = this.state || {};
    c.danger = dark ? '#F87171' : '#DC2626';
    const field = st.field || 'reps';
    const vals = { kg: st.kg ?? '82.5', reps: st.reps ?? '10' };
    const setVal = (v) => this.setState({ [field]: v });
    const fields = [
      { id: 'kg', label: 'Weight', unit: 'kg' },
      { id: 'reps', label: 'Reps', unit: '' }
    ].map((f) => {
      const on = f.id === field;
      return { label: f.label, unit: f.unit, value: vals[f.id] || '0', on: on, edge: on ? c.primary : c.border, bg: on ? c.raised : 'transparent', pick: () => this.setState({ field: f.id }) };
    });
    const cur = vals[field];
    const stepN = field === 'kg' ? 2.5 : 1;
    const fmt = (n) => String(Math.round(n * 100) / 100);
    const down = () => setVal(fmt(Math.max(0, (parseFloat(cur) || 0) - stepN)));
    const up = () => setVal(fmt((parseFloat(cur) || 0) + stepN));
    const press = (k) => () => {
      if (k === 'back') return setVal(cur.length > 1 ? cur.slice(0, -1) : '0');
      if (k === '.') return field === 'kg' && cur.indexOf('.') < 0 ? setVal(cur + '.') : null;
      return setVal(cur === '0' ? k : (cur + k).slice(0, 6));
    };
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'back'].map((k) => ({
      label: k,
      isBack: k === 'back',
      isText: k !== 'back',
      aria: k === 'back' ? 'Delete' : k === '.' ? 'Decimal point' : k,
      color: k === '.' && field !== 'kg' ? c.muted : c.text,
      press: press(k)
    }));
    return { c, r, font, fields, keys, down, up, step: field === 'kg' ? '2.5 kg' : '1 rep' };
  }
}
</script>
</body>
</html>
