<!DOCTYPE html><html lang="en"><head><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<title>Herculean · Setup</title>



<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #050506; color: #F2F3F5; font-family: 'Chakra Petch', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 48px 16px 16px; min-height: 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Welcome to Herculean</p>
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">Set up</h1>
<p style="margin: 0; font-size: 14px; color: #A9AEB6">You can change all of this later in Settings.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="name" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Name</label>
<input id="name" type="text" autocomplete="name" placeholder="Your name" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0px 12px; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 16px;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p id="units-label" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Units</p>
<div role="radiogroup" aria-labelledby="units-label" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">

<button role="radio" aria-checked="" style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 12px; border-radius: 4px; border: 1px solid #1A55E6; background: #17181B; color: #F2F3F5; text-align: left; cursor: pointer">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Metric</span><span style="font-size: 12px; color: #A9AEB6">kg, cm</span></span>
<span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #1A55E6; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 999px; background: #1A55E6"></span></span>
</button>

<button role="radio" style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 12px; border-radius: 4px; border: 1px solid #2C2F34; background: transparent; color: #F2F3F5; text-align: left; cursor: pointer">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Imperial</span><span style="font-size: 12px; color: #A9AEB6">lb, in</span></span>
<span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #A9AEB6; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 999px; background: transparent"></span></span>
</button>

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p id="rest-label" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Default rest time</p>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 8px; align-items: center">
<button aria-label="15 seconds less" style="height: 52px; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<input aria-labelledby="rest-label" inputmode="numeric" value="1:30" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px; text-align: center; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 32px; font-weight: 700;">
<button aria-label="15 seconds more" style="height: 52px; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div role="group" aria-label="Quick picks" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">

<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">1:00</button>

<button aria-pressed="" style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #1A55E6; background: #1A55E6; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">1:30</button>

<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">2:00</button>

<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">2:30</button>

<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">3:00</button>

</div>
<p style="margin: 0; font-size: 12px; color: #A9AEB6">Starts after every checked set.</p>
</div>
</div>
</main>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid #2C2F34; background: #0F1012">
<a href="H05-Home-No-Routines.dc.html" style="height: 48px; box-sizing: border-box; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: #1A55E6; color: #FFFFFF">Finish setup</a>
</div>
</div>




</body></html>
