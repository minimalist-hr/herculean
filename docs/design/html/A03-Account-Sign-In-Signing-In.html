<!DOCTYPE html><html lang="en"><head><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<title>Herculean · Sign in, signing in</title>



<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
@keyframes hc-pulse{0%,100%{opacity:1}50%{opacity:.45}}.sk{animation:hc-pulse 1.4s ease-in-out infinite}@keyframes hc-spin{to{transform:rotate(360deg)}}.spin{animation:hc-spin .8s linear infinite}@media (prefers-reduced-motion: reduce){.sk,.spin{animation:none}}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #050506; color: #F2F3F5; font-family: 'Chakra Petch', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<div style="position: relative; height: 400px; flex: none; overflow: hidden; background: radial-gradient(ellipse 70% 55% at 50% 50%, rgba(26, 85, 230, 0.32), transparent 72%)">
<div style="position: absolute; left: 0; right: 0; top: 184px; display: flex; justify-content: center"><span role="img" aria-label="Herculean" style="font-size: 32px; font-weight: 700; letter-spacing: 0.14em; line-height: 1; white-space: nowrap; color: #F2F3F5"><svg width="25.92" height="29.12" viewBox="-4 0 89 100" aria-hidden="true" style="vertical-align: 0; margin: 0 5.73px 0 0.92px"><polygon points="0,0 19.4,0 23.4,4 23.4,9 19.4,9 19.4,91 23.4,91 23.4,96 19.4,100 0,100 -4,96 -4,91 0,91 0,9 -4,9 -4,4" style="fill: #F2F3F5"></polygon><polygon points="61.6,0 81.0,0 85.0,4 85.0,9 81.0,9 81.0,91 85.0,91 85.0,96 81.0,100 61.6,100 57.6,96 57.6,91 61.6,91 61.6,9 57.6,9 57.6,4" style="fill: #F2F3F5"></polygon><polygon points="19.4,44 61.6,32 61.6,56 19.4,68" style="fill: #1A55E6"></polygon></svg>ERCU<span style="color: #7EA2FF">LEAN</span></span></div>
</div>
<main aria-busy="true" style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 4px 16px 16px; min-height: 0">
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">Sign in</h1>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="email" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Email</label>
<input id="email" type="email" value="you@example.com" readonly="" autocomplete="email" placeholder="" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0px 12px; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 16px;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="password" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Password</label>
<div style="position: relative">
<input id="password" type="password" value="password" readonly="" autocomplete="current-password" placeholder="" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0px 48px 0px 12px; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 16px;">
<button aria-label="Show password" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: none; background: transparent; color: #A9AEB6; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
</div>
<a href="A10-Account-Reset-Password.dc.html" style="align-self: flex-start; margin-top: -16px; height: 44px; margin-left: -8px; padding: 0 8px; display: flex; align-items: center; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7EA2FF; opacity: 0.5; pointer-events: none" aria-disabled="true">Forgot password?</a>
</main>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid #2C2F34; background: #0F1012">
<button aria-disabled="true" style="height: 48px; border: none; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: #1A55E6; color: #FFFFFF; cursor: wait"><svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>Signing in</button>
<p style="margin: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #A9AEB6">New here?<a href="A20-Account-Create.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 8px; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7EA2FF; opacity: 0.5; pointer-events: none" aria-disabled="true">Create account</a></p>
</div>
</div>




</body></html>
