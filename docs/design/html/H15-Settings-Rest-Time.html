<!DOCTYPE html><html lang="en"><head><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<title>Herculean · Default rest time</title>



<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #050506; color: #F2F3F5; font-family: 'Chakra Petch', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 20px; padding: 40px 16px 16px">
<p style="margin: 0 0 -18px; height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A9AEB6">Home</p>
<p style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700">Settings</p>
<div style="height: 80px; border-radius: 6px; border: 1px solid #2C2F34; background: #0F1012"></div>
<div style="height: 130px; border-radius: 6px; border: 1px solid #2C2F34; background: #0F1012"></div>
<div style="height: 240px; border-radius: 6px; border: 1px solid #2C2F34; background: #0F1012"></div>
</div>
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.62)"></div>
<section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 34px; border-radius: 10px 10px 0 0; border-top: 1px solid #2C2F34; background: #0F1012">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #2C2F34"></span>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="sheet-title" style="margin: 0; font-size: 22px; font-weight: 700">Default rest time</h2>
<p style="margin: 0; font-size: 13px; color: #A9AEB6">Starts after every checked set. You can still change it during rest.</p>
</div>
<a href="H10-Settings.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; margin: -6px -8px 0 0; display: flex; align-items: center; justify-content: center; color: #A9AEB6">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 8px; align-items: center">
<button aria-label="15 seconds less" style="height: 52px; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<input aria-label="Default rest time" inputmode="numeric" value="1:30" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px; text-align: center; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 32px; font-weight: 700;">
<button aria-label="15 seconds more" style="height: 52px; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<div role="group" aria-label="Quick picks" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">1:00</button>
<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">2:00</button>
<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">3:00</button>
<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">4:00</button>
<button style="height: 44px; padding: 0; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 14px; font-weight: 700; cursor: pointer">5:00</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin: 4px -16px 0; padding: 16px 16px 0; border-top: 1px solid #2C2F34">
<a href="H10-Settings.dc.html" style="height: 48px; box-sizing: border-box; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: #1A55E6; color: #FFFFFF">Save rest time</a>

</div>
</section>
</div>




</body></html>
