<!DOCTYPE html><html lang="en"><head><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<title>Herculean · Create account</title>



<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #050506; color: #F2F3F5; font-family: 'Chakra Petch', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 48px 16px 16px; min-height: 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Welcome to Herculean</p>
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">Create account</h1>
<p style="margin: 0; font-size: 14px; color: #A9AEB6">Email and password. Everything else comes next.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="email" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0px 12px; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 16px;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="password" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Password</label>
<div style="position: relative">
<input id="password" type="password" autocomplete="new-password" aria-describedby="password-msg" placeholder="Choose a password" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0px 48px 0px 12px; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 16px;">
<button aria-label="Show password" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: none; background: transparent; color: #A9AEB6; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<p id="password-msg" style="margin: 0; font-size: 12px; color: #A9AEB6">At least 8 characters.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="repeat-password" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Repeat password</label>
<div style="position: relative">
<input id="repeat-password" type="password" autocomplete="new-password" placeholder="Type it again" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0px 48px 0px 12px; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 16px;">
<button aria-label="Show password" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: none; background: transparent; color: #A9AEB6; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #A9AEB6">By creating an account you agree to the <a href="H20-Settings-Terms.dc.html" style="color: #7EA2FF; text-decoration: underline; text-underline-offset: 2px">Terms of service</a> and the <a href="H21-Settings-Privacy.dc.html" style="color: #7EA2FF; text-decoration: underline; text-underline-offset: 2px">Privacy policy</a>.</p>
</main>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid #2C2F34; background: #0F1012">
<a href="A30-Account-Setup.dc.html" style="height: 48px; box-sizing: border-box; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: #1A55E6; color: #FFFFFF">Create account</a>
<a href="A01-Account-Sign-In.dc.html" style="height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 4px; border: 1px solid #2C2F34; background: #17181B; color: #F2F3F5; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Sign in</a>
</div>
</div>




</body></html>
