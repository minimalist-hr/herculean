<!DOCTYPE html><html lang="en"><head><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<title>Herculean · New password</title>



<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #050506; color: #F2F3F5; font-family: 'Chakra Petch', system-ui, sans-serif; font-variant-numeric: tabular-nums">
<main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 40px 16px 16px; min-height: 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="A01-Account-Sign-In.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; height: 44px; margin-left: -8px; padding: 0 8px; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A9AEB6">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
Sign in
</a>
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">New password</h1>
<p style="margin: 0; font-size: 14px; color: #A9AEB6">For you@example.com.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="new-password" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">New password</label>
<div style="position: relative">
<input id="new-password" type="password" autocomplete="new-password" aria-describedby="new-password-msg" placeholder="New password" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0px 48px 0px 12px; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 16px;">
<button aria-label="Show password" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: none; background: transparent; color: #A9AEB6; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<p id="new-password-msg" style="margin: 0; font-size: 12px; color: #A9AEB6">At least 8 characters.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="repeat-password" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A9AEB6">Confirm new password</label>
<div style="position: relative">
<input id="repeat-password" type="password" autocomplete="new-password" placeholder="Confirm password" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0px 48px 0px 12px; border-radius: 4px; border: 1px solid rgb(44, 47, 52); background: rgb(23, 24, 27); color: rgb(242, 243, 245); font-family: inherit; font-size: 16px;">
<button aria-label="Show password" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: none; background: transparent; color: #A9AEB6; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
</div>
</main>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid #2C2F34; background: #0F1012">
<a href="A01-Account-Sign-In.dc.html" style="height: 48px; box-sizing: border-box; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: #1A55E6; color: #FFFFFF">Save password</a>
</div>
</div>




</body></html>
